# Weekly: pull the latest Google reviews; if anything changed, commit
# src/data/reviews.json and redeploy the site to Cloudflare.
#
# Repo secrets needed (Settings → Secrets and variables → Actions):
#   DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD  — review data source
#   CLOUDFLARE_API_TOKEN                   — "Edit Cloudflare Workers" token
#   CLOUDFLARE_ACCOUNT_ID                  — Cloudflare account the Worker lives in
name: Refresh Google reviews

on:
  schedule:
    - cron: "0 22 * * 0" # Sundays 22:00 UTC = Mondays 6am Perth
  workflow_dispatch: # "Run workflow" button for an on-demand refresh
    inputs:
      force_deploy:
        description: "Deploy even if the reviews haven't changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch reviews
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GOOGLE_PLACE_ID: ChIJ_SGbxeIf2gcR0dHXVm7U2yY
        run: node scripts/fetch-reviews.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/reviews.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated reviews
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/reviews.json
          git commit -m "Refresh Google reviews"
          git push

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true' || inputs.force_deploy
        run: npm ci

      - name: Build and deploy
        if: steps.diff.outputs.changed == 'true' || inputs.force_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
